<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GLOMI | Usuarios</title>

    <link
        rel="stylesheet"
        href="css/admin.css">

</head>

<body>

<div class="admin-layout">


    <aside class="sidebar">

        <div class="admin-logo">
            GLOMI
        </div>

        <div class="admin-subtitle">
            Panel de administración
        </div>


        <nav class="admin-nav">

            <a href="index.html">
                <span>▦</span>
                Dashboard
            </a>

            <a
                href="usuarios.html"
                class="active">

                <span>👥</span>
                Usuarios

            </a>

            <a href="perfiles.html">
                <span>👤</span>
                Perfiles
            </a>

            <a href="proyectos.html">
                <span>📁</span>
                Proyectos
            </a>

            <a href="galeria.html">
                <span>🖼</span>
                Galería
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="../index.html">
                Ver sitio web
            </a>

            <button id="logoutButton">
                Cerrar sesión
            </button>

        </div>

    </aside>


    <main class="admin-main">


        <header class="admin-header">

            <div>

                <h1>
                    Usuarios
                </h1>

                <p>
                    Administración de cuentas y permisos
                </p>

            </div>

            <button
                class="btn btn-primary"
                id="nuevoUsuario">

                + Nuevo usuario

            </button>

        </header>


        <section class="panel">


            <div class="table-toolbar">

                <input
                    type="search"
                    id="buscarUsuario"
                    placeholder="Buscar usuario...">

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Nombre
                            </th>

                            <th>
                                Correo
                            </th>

                            <th>
                                Rol
                            </th>

                            <th>
                                Estado
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tablaUsuarios">

                    </tbody>

                </table>

            </div>

        </section>


    </main>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="usuarioModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Nuevo usuario
            </h2>

            <button
                class="modal-close"
                data-close-modal>

                ×

            </button>

        </div>


        <form id="usuarioForm">


            <div class="form-group">

                <label>
                    Nombre
                </label>

                <input
                    type="text"
                    id="usuarioNombre"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Correo
                </label>

                <input
                    type="email"
                    id="usuarioEmail"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Rol
                </label>

                <select id="usuarioRol">

                    <option value="Administrador">
                        Administrador
                    </option>

                    <option value="Editor">
                        Editor
                    </option>

                    <option value="Técnico">
                        Técnico
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Estado
                </label>

                <select id="usuarioEstado">

                    <option value="Activo">
                        Activo
                    </option>

                    <option value="Inactivo">
                        Inactivo
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-close-modal>

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Guardar

                </button>

            </div>


        </form>

    </div>

</div>


<script src="js/admin.js"></script>

</body>

</html>
